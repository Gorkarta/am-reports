{{TOP}}<h2 style="font-size:15px;margin:22px 0 8px;color:#c7c2d6">Карта продаж</h2><div class=tabs id=tabs></div><div class=m id=hint>Размер плитки — число реализованных билетов (проданные + пригласительные). Цвет: красный — плохо, зелёный — хорошо, чем сильнее изменение, тем насыщеннее.</div><div class=lg id=lg></div><div id=map></div><div class=m style="margin-top:10px" id=zero></div><div id=tip></div><script>
const D={{DATA}};
const NEU=[45,42,59],RED=[255,84,112],GRN=[52,211,153];
const mix=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')';
const pct=e=>e.pw7>=10?(e.w7-e.pw7)/e.pw7:null;
const sc=v=>v>=0?mix(NEU,GRN,Math.min(v,1)*.9):mix(NEU,RED,Math.min(-v,1)*.9);
const MODES={
 dyn:{name:'Динамика: 7 дней к предыдущим 7',lo:'падение / стоит',hi:'рост',col:e=>{if(e.since_last!=null&&e.since_last>=6)return [sc(-1),'стоит '+Math.round(e.since_last)+' дн.'];const p=pct(e);if(p==null)return ['#2d2a3b','мало данных (пред. 7 дн. < 10 бил.)'];return [sc(p/0.6),(p>0?'+':'')+Math.round(p*100)+'% к пред. 7 дн.']}},
 share:{name:'Вклад в продажи периода',lo:'нет продаж за период',hi:'больше всех билетов',col:e=>{const tot=D.reduce((s,x)=>s+Math.max(x.new_n,0),0);if(e.new_n<=0)return [sc(-.45),'за период нет продаж'];const p=e.new_n/tot;return [sc(.25+p*4),Math.round(p*100)+'% билетов периода (+'+e.new_n+')']}}
};
let mode='dyn';
function squarify(items,x,y,w,h){const out=[];let rest=items.slice();const tot=rest.reduce((s,i)=>s+i.v,0);rest.forEach(i=>i.a=i.v/tot*w*h);
 function worst(row,side){const s=row.reduce((a,i)=>a+i.a,0);const mx=Math.max(...row.map(i=>i.a)),mn=Math.min(...row.map(i=>i.a));return Math.max(side*side*mx/(s*s),s*s/(side*side*mn))}
 while(rest.length){const side=Math.min(w,h);let row=[rest[0]],k=1;while(k<rest.length&&worst(row.concat(rest[k]),side)<=worst(row,side)){row.push(rest[k]);k++}
  const s=row.reduce((a,i)=>a+i.a,0);if(w>=h){const rw=s/h;let cy=y;row.forEach(i=>{const ih=i.a/rw;out.push({...i,x,y:cy,w:rw,h:ih});cy+=ih});x+=rw;w-=rw}else{const rh=s/w;let cx=x;row.forEach(i=>{const iw=i.a/rh;out.push({...i,x:cx,y:y,w:iw,h:rh});cx+=iw});y+=rh;h-=rh}
  rest=rest.slice(row.length)}return out}
function draw(){const el=document.getElementById('map');el.innerHTML='';const W=el.clientWidth,H=el.clientHeight;
 const items=D.map(e=>({e,v:Math.max(e.sold,40)})).sort((a,b)=>b.v-a.v);
 squarify(items,0,0,W,H).forEach(r=>{const e=r.e,[c,txt]=MODES[mode].col(e);const d=document.createElement('div');d.className='tm'+(r.w<90||r.h<56?(r.w<60||r.h<34?' xs':' s'):'');
  d.style.cssText+=`left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${c}`;
  d.innerHTML=`<b>${e.short}</b><span class=n>${e.sold.toLocaleString('ru')}</span><em>${e.dt} · ${txt}</em>`;
  d.onmousemove=ev=>{const t=document.getElementById('tip');t.className='';t.style.display='block';t.style.left=Math.min(ev.clientX+14,innerWidth-260)+'px';t.style.top=ev.clientY+14+'px';t.innerHTML=`<b>${e.name}</b><br>${e.dt}.2026 · через ${e.days_left} дн.<br>Реализовано ${e.sold} бил. · ${(e.rev/1e6).toFixed(2)} млн ₽<br>За период: ${e.new_n>0?'+':''}${e.new_n} бил.<br>7 дн.: ${e.w7} (пред. ${e.pw7})<br>${txt}`};d.onmouseleave=()=>document.getElementById('tip').style.display='none';el.appendChild(d)})}
function setMode(m){mode=m;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));document.getElementById('lg').innerHTML=`<span>Красный — плохо: ${MODES[m].lo}</span><span style="width:220px;height:10px;border-radius:5px;background:linear-gradient(90deg,${sc(-1)},#2d2a3b,${sc(1)})"></span><span>Зелёный — хорошо: ${MODES[m].hi}</span>`;draw()}
document.getElementById('tabs').innerHTML=Object.entries(MODES).map(([k,v])=>`<button data-m=${k}>${v.name}</button>`).join('');
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.m)));
document.getElementById('zero').textContent={{ZERO}};
addEventListener('resize',draw);setMode('dyn');
(function(){const T=document.getElementById('tip');let pin=null;
function show(el,x,y){T.className='t2';T.style.display='block';T.innerHTML=el.getAttribute('data-tip');T.style.left=Math.max(8,Math.min(x+14,innerWidth-320))+'px';T.style.top=(y+16)+'px'}
function bind(){document.querySelectorAll('[data-tip]').forEach(el=>{if(el._b)return;el._b=1;
el.addEventListener('mousemove',ev=>show(el,ev.clientX,ev.clientY));
el.addEventListener('mouseleave',()=>{if(pin!==el)T.style.display='none'});
el.addEventListener('click',ev=>{if(el.tagName==='BUTTON')return;if(pin===el){pin=null;T.style.display='none'}else{pin=el;show(el,ev.clientX,ev.clientY)}})})}
document.addEventListener('click',ev=>{if(!ev.target.closest('[data-tip]')){pin=null;T.style.display='none'}});
const TB={'dyn':'Цвет — изменение продаж за 7 дней к предыдущим 7 дням. Серый — мало данных (меньше 10 билетов в предыдущие 7 дней).','share':'Цвет — доля мероприятия в билетах периода между выгрузками. Серый — продаж за период не было.'};
setTimeout(()=>{document.querySelectorAll('#tabs button').forEach((b,i)=>b.setAttribute('data-tip',Object.values(TB)[i]||''));bind()},0);bind()})();
</script>
